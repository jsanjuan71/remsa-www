<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REMSA — Selección de propuesta</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .logo { margin-bottom: 2.5rem; }
    .logo img { height: 56px; object-fit: contain; }
    h1 { font-size: 1rem; letter-spacing: 0.2em; text-transform: uppercase; color: #666; margin-bottom: 3rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; width: 100%; max-width: 560px; }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 2.5rem 1.5rem;
      border: 1px solid #222;
      text-decoration: none;
      color: #fff;
      transition: border-color 0.2s, background 0.2s;
    }
    .card:hover { background: #1a1a1a; }
    .card-a { border-top: 3px solid #F5C000; }
    .card-a:hover { border-color: #F5C000; }
    .card-b { border-top: 3px solid #1A3A5C; }
    .card-b:hover { border-color: #1A3A5C; }
    .card-label { font-size: 0.65rem; letter-spacing: 0.18em; text-transform: uppercase; color: #555; }
    .card-name { font-size: 1.1rem; font-weight: 700; }
    .card-desc { font-size: 0.8rem; color: #666; text-align: center; line-height: 1.5; }
    @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="logo">
    <img src="docs/logo.jpeg" alt="REMSA">
  </div>
  <h1>Selección de propuesta visual</h1>
  <div class="grid">
    <a href="propuesta-a.html" class="card card-a">
      <span class="card-label">Propuesta A</span>
      <span class="card-name">Industrial Premium</span>
      <span class="card-desc">Dark mode · Paleta negra, amarilla y roja · Estética maquinaria pesada</span>
    </a>
    <a href="propuesta-b.html" class="card card-b">
      <span class="card-label">Propuesta B</span>
      <span class="card-name">Confianza Técnica</span>
      <span class="card-desc">Light mode · Azul corporativo · Institucional e internacional</span>
    </a>
  </div>
</body>
</html>
